[package]
name = "sgraph-desktop"
version = "0.1.0"
description = "SGraph Desktop — native macOS access to the SGraph ecosystem"
authors = ["SGraph AI"]
edition = "2021"

[lib]
name = "sgraph_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
