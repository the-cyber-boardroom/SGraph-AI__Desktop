name: CI Pipeline - Android

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main
    paths:
      - 'src/android/**'
      - 'src/core/**'
      - 'src-tauri/**'
      - '.github/workflows/ci-pipeline__android.yml'

jobs:
  build-android:
    name: "Build Android"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - target: aarch64
            rust_target: aarch64-linux-android
            arch: arm64-v8a
          - target: armv7
            rust_target: armv7-linux-androideabi
            arch: armeabi-v7a
          - target: x86_64
            rust_target: x86_64-linux-android
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch latest tags
        run: git fetch --tags --force

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Tauri CLI
        uses: actions/cache@v4
        id: cache-tauri-cli
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-${{ runner.os }}-android-v2

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-deps-${{ runner.os }}-android-${{ matrix.arch }}-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: |
            rust-deps-${{ runner.os }}-android-${{ matrix.arch }}-

      - name: Read version
        id: version
        run: |
          VERSION=$(cat version)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION#v}\"/" src-tauri/tauri.conf.json

      - name: Initialise Tauri Android project
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            cargo tauri android init
          fi

      - name: Build Android app
        run: cargo tauri android build --target ${{ matrix.target }}

      - name: Sign APK
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ]; then
            echo "No Android keystore configured — APK will be unsigned (debug)"
            exit 0
          fi

          KEYSTORE_PATH=$RUNNER_TEMP/sgraph-desktop.jks
          echo -n "$ANDROID_KEYSTORE" | base64 --decode > $KEYSTORE_PATH

          # Find the unsigned APK
          APK_PATH=$(find src-tauri/gen/android -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found to sign"
            exit 0
          fi

          # Sign with apksigner
          $ANDROID_HOME/build-tools/*/apksigner sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            "$APK_PATH"

          echo "APK signed successfully"

      - name: Find build output
        id: output
        run: |
          APK_PATH=$(find src-tauri/gen/android -name "*.apk" -type f | head -1)
          AAB_PATH=$(find src-tauri/gen/android -name "*.aab" -type f | head -1)
          if [ -n "$APK_PATH" ]; then
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            echo "Found APK: $APK_PATH"
          fi
          if [ -n "$AAB_PATH" ]; then
            echo "aab_path=$AAB_PATH" >> $GITHUB_OUTPUT
            echo "Found AAB: $AAB_PATH"
          fi

      - name: Upload APK artifact
        if: steps.output.outputs.apk_path
        uses: actions/upload-artifact@v4
        with:
          name: SGraph-Desktop-Android-${{ matrix.arch }}-apk
          path: ${{ steps.output.outputs.apk_path }}
          retention-days: 7

      - name: Upload AAB artifact
        if: steps.output.outputs.aab_path
        uses: actions/upload-artifact@v4
        with:
          name: SGraph-Desktop-Android-${{ matrix.arch }}-aab
          path: ${{ steps.output.outputs.aab_path }}
          retention-days: 7
