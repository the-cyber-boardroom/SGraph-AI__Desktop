name: Release (Production)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: "Build & Sign macOS (${{ matrix.arch }})"
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
            arch: aarch64
          - target: x86_64-apple-darwin
            runner: macos-13
            arch: x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Tauri CLI
        uses: actions/cache@v4
        id: cache-tauri-cli
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-${{ runner.os }}-${{ matrix.arch }}

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-deps-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: |
            rust-deps-${{ runner.os }}-${{ matrix.arch }}-

      - name: Read version and set product name
        id: version
        run: |
          VERSION=$(cat version)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building release: $VERSION"
          # Inject version into app name and title (not hardcoded in tauri.conf.json)
          sed -i '' "s/\"productName\": \"SGraph Desktop[^\"]*\"/\"productName\": \"SGraph Desktop $VERSION\"/" src-tauri/tauri.conf.json
          sed -i '' "s/\"title\": \"SGraph Desktop[^\"]*\"/\"title\": \"SGraph Desktop $VERSION\"/" src-tauri/tauri.conf.json
          sed -i '' "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION#v}\"/" src-tauri/tauri.conf.json
          echo "Product name: SGraph Desktop $VERSION"

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::No Apple certificate — release will be unsigned"
            exit 0
          fi

          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Build Tauri app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: cargo tauri build --target ${{ matrix.target }}

      - name: Notarise DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          if [ -z "$APPLE_ID" ]; then
            echo "::warning::No Apple ID — skipping notarisation"
            exit 0
          fi

          xcrun notarytool submit \
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_PASSWORD" \
            --wait
          xcrun stapler staple \
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      - name: Rename DMG with architecture
        id: rename
        run: |
          DMG_PATH=$(ls src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          DMG_DIR=$(dirname "$DMG_PATH")
          DMG_NAME=$(basename "$DMG_PATH" .dmg)
          NEW_NAME="${DMG_NAME}_${{ matrix.arch }}.dmg"
          mv "$DMG_PATH" "$DMG_DIR/$NEW_NAME"
          echo "dmg_path=$DMG_DIR/$NEW_NAME" >> $GITHUB_OUTPUT
          echo "Renamed: $DMG_NAME.dmg → $NEW_NAME"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: SGraph-Desktop-${{ matrix.arch }}-dmg
          path: ${{ steps.rename.outputs.dmg_path }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "SGraph Desktop ${{ steps.tag.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/SGraph-Desktop-aarch64-dmg/*.dmg
            artifacts/SGraph-Desktop-x86_64-dmg/*.dmg
          body: |
            ## SGraph Desktop ${{ steps.tag.outputs.tag }}

            ### Download

            | Architecture | Download |
            |-------------|----------|
            | **Apple Silicon** (M1/M2/M3/M4) | Download the `aarch64` DMG below |
            | **Intel** (Core i5/i7/i9) | Download the `x86_64` DMG below |

            ### Installation

            1. Download the `.dmg` file for your Mac
            2. Open the DMG and drag **SGraph Desktop** to Applications
            3. Launch from Applications or Spotlight
            4. macOS will confirm the app has been checked by Apple — click **Open**

            ### What's included

            - Native macOS app shell with sidebar navigation
            - **SG/Send** — encrypted file sharing
            - **SG/Vault** — personal vault
            - **SG/Workspace** — document transformation
            - **SG/Tools** — browser utilities
            - All sites load in native WebKit webviews
            - Signed and notarised by Apple

            ### System Requirements

            - macOS 13.0 (Ventura) or later
            - Apple Silicon (M1/M2/M3/M4) or Intel (x86_64)
